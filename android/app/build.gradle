plugins {
    id 'com.android.application'
}

// Version comes from the GitHub Actions build number: -Pvcode=5 -Pvname=1.0.5
def vcode = (project.findProperty('vcode') ?: '1').toString().toInteger()
def vname = (project.findProperty('vname') ?: '1.0.1').toString()

android {
    namespace 'uz.uzbekkeys'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.uzbekkeys'
        minSdk 21
        targetSdk 34
        versionCode vcode
        versionName vname
    }

    signingConfigs {
        release {
            // Keystore and password come from GitHub secrets (see .github/workflows/android.yml)
            def ks = System.getenv('KS_FILE')
            if (ks != null) {
                storeFile file(ks)
                storePassword System.getenv('KS_PASS')
                keyAlias 'uzbekkeys'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
