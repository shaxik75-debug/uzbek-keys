name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'whatsnew.txt'
      - 'whatsnew-ios.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Draw app icon
        run: swift ios/tools/make_icon.swift ios/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Bundle "what's new"
        run: |
          # whatsnew-ios.txt (if present) describes changes made only on iPhone.
          if [ -f whatsnew-ios.txt ]; then cp whatsnew-ios.txt notes.txt; else cp whatsnew.txt notes.txt; fi
          cp notes.txt ios/App/whatsnew.txt

      - name: Generate project
        working-directory: ios
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project UzbekKeys.xcodeproj -target UzbekKeys -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Release-iphoneos/UzbekKeys.app Payload/
          ls Payload/UzbekKeys.app/PlugIns
          ls Payload/UzbekKeys.app/whatsnew.txt
          zip -qry UzbekKeys.ipa Payload
          echo "${{ github.run_number }}" > ios-version.txt
          {
            echo "iPhone keyboard (unsigned). Install UzbekKeys.ipa with Sideloadly using your Apple ID. Build ${{ github.run_number }}."
            echo
            echo "Yangiliklar / Что нового:"
            echo
            cat notes.txt
          } > release-notes.md

      - name: Publish to release "ios"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios
          name: Uzbek Keys for iPhone
          body_path: release-notes.md
          make_latest: 'false'
          files: |
            UzbekKeys.ipa
            ios-version.txt
