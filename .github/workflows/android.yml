name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'tools/make_icon.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Draw launcher icons
        run: |
          pip install pillow
          python tools/make_icon.py android android/app/src/main/res

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        working-directory: android
        env:
          KS_FILE: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease -Pvcode=${{ github.run_number }} -Pvname=1.0.${{ github.run_number }} --no-daemon --stacktrace

      - name: Prepare files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk UzbekKeys.apk
          echo "${{ github.run_number }}" > version.txt

      - name: Publish to release "android"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Uzbek Keys for Android
          body: |
            Android keyboard: install UzbekKeys.apk on the phone.
            Build ${{ github.run_number }}.
          make_latest: 'false'
          files: |
            UzbekKeys.apk
            version.txt
